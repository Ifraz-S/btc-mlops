# ConfigMap = normal settings (safe to show).  Secret = sensitive values.
# Both are injected into the pods as environment variables by deployment.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-api-config
  labels:
    app: btc-forecast-api
data:
  MODEL_STAGE: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  MODEL_DIR: "/app/models"
  GUNICORN_WORKERS: "1"   # 1 process x 4 threads keeps memory under the limit
  GUNICORN_THREADS: "4"
---
apiVersion: v1
kind: Secret
metadata:
  name: btc-api-secret
  labels:
    app: btc-forecast-api
type: Opaque
# stringData lets you write plain text; Kubernetes stores it base64-encoded.
# In a real project this file would not be committed with real values.
stringData:
  API_TOKEN: "change-me-k8s-token"
  COINGECKO_API_KEY: "not-required-for-free-tier"
